<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Utility & Dispute Resolver</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23264d3c'/><path d='M9 22V12l7-5 7 5v10z' fill='none' stroke='%23f4efe6' stroke-width='2.4' stroke-linejoin='round'/><path d='M14 22v-5h4v5' stroke='%23e8a33d' stroke-width='2.4' fill='none'/></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 32 32"><path d="M9 22V12l7-5 7 5v10z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M14 22v-5h4v5" stroke="var(--accent)" stroke-width="2.4" fill="none"/></svg>
      </div>
      <div>
        <div class="brand-title">FairShare</div>
        <div class="brand-sub" id="aptName">Utility &amp; Dispute Resolver</div>
      </div>
    </div>
    <nav id="nav">
      <a data-view="dashboard" class="active"><span class="ico">◧</span>Dashboard</a>
      <a data-view="bills"><span class="ico">⚡</span>Bills</a>
      <a data-view="roommates"><span class="ico">☺</span>Roommates</a>
      <a data-view="payments"><span class="ico">⇄</span>Payments</a>
      <a data-view="disputes"><span class="ico">⚑</span>Disputes <span class="pill-count" id="disputeCount" hidden></span></a>
      <a data-view="reports"><span class="ico">▤</span>Reports</a>
      <a data-view="activity"><span class="ico">◷</span>Activity log</a>
      <a data-view="settings"><span class="ico">⚙</span>Settings</a>
    </nav>
    <div class="sidebar-foot">Offline · Java 17+ · data saved to CSV</div>
  </aside>

  <main>
    <header class="topbar">
      <div>
        <h1 id="viewTitle">Dashboard</h1>
        <div class="crumb" id="viewSub"></div>
      </div>
      <div class="month-picker">
        <button class="icon-btn" id="prevMonth" title="Previous month">‹</button>
        <input type="month" id="monthInput" aria-label="Month">
        <button class="icon-btn" id="nextMonth" title="Next month">›</button>
        <span class="status-chip" id="monthStatus"></span>
      </div>
    </header>
    <section id="view" class="view"></section>
  </main>
</div>

<div class="modal-backdrop" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h2 id="modalTitle"></h2>
      <button class="icon-btn" id="modalClose" aria-label="Close">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
